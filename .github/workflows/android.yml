name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore original Alqadi app icon
        run: curl -L --fail --retry 3 -o app-profile.jpg https://raw.githubusercontent.com/mdrstalnwr33-beep/Alqadi-science-expo-apk/main/app-profile.jpg
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache
      - name: Measure APK
        shell: bash
        run: |
          APK=$(find "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK_PATH=$APK"
          stat -c 'APK_BYTES=%s' "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noura-science-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
